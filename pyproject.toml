[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparta-regulatory-transformer"
version = "1.0.0"
description = "Spatial and Physics-Aware Regulatory Transformer Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Mao-Yuan Yang" },
  { name = "Pu-Feng Du" },
]
keywords = [
  "gene-expression",
  "regulatory-genomics",
  "deep-learning",
  "chromatin-conformation",
  "transformer",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "h5py>=3.10,<4",
  "hic-straw>=1.3,<2",
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyBigWig>=0.3.22,<0.4",
  "pyfaidx>=0.8,<0.9",
  "PyYAML>=6.0,<7",
  "scipy>=1.10,<2",
  "torch>=2.3,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/MaoyuanYang/SPARTA"
Repository = "https://github.com/MaoyuanYang/SPARTA"
Issues = "https://github.com/MaoyuanYang/SPARTA/issues"

[project.scripts]
sparta = "sparta.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sparta"]
