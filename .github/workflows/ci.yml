name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU training and test dependencies
        run: |
          python -m pip install "torch>=2.3,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pytest>=8,<9" "ruff>=0.5,<1" "numpy>=1.24,<3" "h5py>=3.10,<4" "scipy>=1.10,<2" "pandas>=2,<3" "joblib>=1.3,<2" "pyyaml>=6,<7" "tqdm>=4.66,<5"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Run full regression suite
        env:
          PYTHONPATH: src
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: pytest tests
