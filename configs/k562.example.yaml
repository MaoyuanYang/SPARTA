project:
  name: SPARTA
  cell_line: K562
  genome_assembly: hg38

pipeline:
  download_missing: false

resources:
  histone_genes:
    path: ../data/raw/reference/histone_genes.tsv
    url: https://www.genenames.org/cgi-bin/genegroup/download?id=864&type=branch
    sha256: null
    source_page: https://www.genenames.org/
  gencode_gtf:
    path: ../data/raw/reference/gencode.v48.annotation.gtf.gz
    url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_48/gencode.v48.annotation.gtf.gz
    sha256: null
    source_page: https://www.gencodegenes.org/human/release_48.html
  cage_peaks_bed:
    path: ../data/raw/reference/hg38_fair+new_CAGE_peaks_phase1and2.bed.gz
    url: https://fantom.gsc.riken.jp/5/datafiles/reprocessed/hg38_latest/extra/CAGE_peaks/hg38_fair+new_CAGE_peaks_phase1and2.bed.gz
    sha256: null
    source_page: https://fantom.gsc.riken.jp/5/data/
